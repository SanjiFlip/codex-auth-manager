<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"><title>Codex Meter</title><link rel="icon" href="data:,"><link rel="stylesheet" href="meter.css"></head><body>
<main class="meter-shell">
<header class="meter-head"><button id="main-btn" class="meter-brand" title="打开主窗口"><span class="meter-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1.1 5.6 3.9 8.4 9.5 9.5-5.6 1.1-8.4 3.9-9.5 9.5C10.9 15.9 8.1 13.1 2.5 12c5.6-1.1 8.4-3.9 9.5-9.5Z" fill="currentColor"/></svg></span>Codex Meter</button><span id="plan" class="plan">—</span><div class="head-buttons"><button id="theme-btn" aria-label="切换主题" title="切换主题"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3a8.5 8.5 0 1 0 10 10.5Z"/></svg></button><button id="refresh-btn" aria-label="刷新本地数据" title="刷新本地数据"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg></button><button id="pin-btn" aria-label="置顶悬浮窗" title="置顶悬浮窗" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 6 4 4v2H6v-2l4-4-1-6Zm3 12v6"/></svg></button><button id="close-btn" aria-label="关闭悬浮窗" title="关闭悬浮窗"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div></header>
<div class="meter-content">
<section class="hero"><div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40"/><circle class="progress" id="ring-progress" cx="50" cy="50" r="40"/></svg><div class="ring-center"><strong id="session">—</strong><small>剩余可用</small></div></div><div class="hero-copy"><small id="quota-title">每周额度</small><strong id="health">等待账号</strong><p id="session-reset">登录后自动获取</p></div></section>
<section class="weekly" id="weekly-section"><div><span>每周额度</span><strong id="weekly">—</strong></div><div class="track"><i id="weekly-bar"></i></div><p id="weekly-reset">恢复时间待获取</p></section>
<section class="mini-stats"><div><span class="stat-icon blue"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg></span><strong id="resets">—</strong><small>可用重置</small></div><div><span class="stat-icon green"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9m-4-16.25 8 4.5"/></svg></span><strong id="tokens">—</strong><small title="本机所有账号的今日 Tokens">今日 Tokens</small></div><div><span class="stat-icon orange"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a8 8 0 0 1-8 8H5l-3 2 1.5-5A8 8 0 1 1 20 11.5Z"/><path d="M7 9h8m-8 4h5"/></svg></span><strong id="sessions">—</strong><small title="本机所有账号的今日会话">今日会话</small></div></section>
<section class="account-area" aria-label="账号切换"><div class="account-caption"><span>使用账号</span><span id="selection-state">当前账号</span></div>
<button id="account-trigger" class="account-trigger" aria-label="选择账号" aria-haspopup="listbox" aria-expanded="false" aria-controls="account-options"><span class="account-avatar" id="selected-avatar">C</span><span class="selected-copy"><strong id="selected-name">暂无账号</strong><small id="selected-plan">在主界面添加账号</small></span><span class="chevron" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m7 14 5-5 5 5"/></svg></span></button>
<div id="account-menu" class="account-menu" hidden><div class="menu-heading">选择要使用的账号</div><div id="account-options" role="listbox" aria-label="可用账号"></div></div>
<button id="switch-btn" class="switch-button" disabled>正在使用此账号</button></section>
<footer><span class="freshness"><i></i><span id="freshness">本地快照 · 待更新</span></span><button id="open-main">主界面 ↗</button></footer>
</div></main>
<dialog id="switch-confirm" aria-labelledby="confirm-title"><h2 id="confirm-title">切换账号</h2><p id="confirm-name"></p><p id="confirm-warning">将关闭并重启 Codex，请先保存当前任务。</p><div class="dialog-actions"><button id="cancel-switch">取消</button><button id="confirm-switch" class="primary">确认切换</button></div></dialog>
<dialog id="exit-blocked" aria-labelledby="exit-title"><h2 id="exit-title">Codex 仍在托盘运行</h2><p id="exit-help">请右键右下角 Codex 托盘图标，选择退出。凭据尚未改写。</p><div class="dialog-actions exit-actions"><button id="retry-exit" class="primary">已从托盘退出，重试</button><button id="force-exit">结束后台并切换…</button><button id="cancel-exit">取消</button></div></dialog>
<div id="message" role="status" aria-live="polite" hidden></div>
<script src="plans.js"></script><script src="statistics.js"></script><script src="meter.js"></script></body></html>
