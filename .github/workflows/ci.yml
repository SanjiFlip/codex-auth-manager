name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx electron scripts/window-lifecycle-smoke.js
      - run: npx electron scripts/smoke-electron.js
      - run: npx electron scripts/knowledge-smoke.js
      - run: node scripts/resume-smoke.js
      - run: npx electron scripts/skills-smoke.js
      - run: npx electron scripts/design-smoke.js
      - run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - run: npx electron scripts/window-lifecycle-smoke.js --packaged
      - run: npx electron scripts/knowledge-smoke.js --packaged
      - run: node scripts/resume-smoke.js --packaged
      - run: npx electron scripts/skills-smoke.js --packaged
      - run: node scripts/mac-packaged-smoke.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
